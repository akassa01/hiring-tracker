name: Daily snapshot

on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/snapshot.mjs
      - run: node scripts/metrics.mjs
      - name: Commit snapshot
        run: |
          git config user.name "hiring-tracker-bot"
          git config user.email "hiring-tracker-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "snapshot: $(date -u +%F)"
          git push
